<!DOCTYPE html>
<html lang="cs" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <link rel="canonical" href="https://electricvanfam.com/" />
    <link rel="alternate" hreflang="cs" href="https://electricvanfam.com/cs/" />
    <link rel="alternate" hreflang="de" href="https://electricvanfam.com/de/" />
    <link rel="alternate" hreflang="en" href="https://electricvanfam.com/en/" />
    <link rel="alternate" hreflang="x-default" href="https://electricvanfam.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Electric Van Fam</title>
    <meta name="description" content="Electric Van Fam: a family converting a brand-new Kia PV5 into an electric camper van, with road trips and camping across Europe. New video every Thursday." />
    <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/img/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png" />

    <!-- The language chooser, the site's x-default page. Before first paint it sends the
         visitor on: the stored choice (evf-lang), else the first browser language the site
         has, else Czech. LANGS lists the language folders; without script the list below
         stays on screen. -->
    <script>
      (function () {
        var LANGS = ["cs", "en", "de"];
        var pick = null;
        try {
          var s = localStorage.getItem("evf-lang");
          if (LANGS.indexOf(s) >= 0) pick = s;
        } catch (e) {}
        var nav = navigator.languages || [navigator.language || ""];
        for (var i = 0; !pick && i < nav.length; i++) {
          var p = String(nav[i]).toLowerCase().split("-")[0];
          if (LANGS.indexOf(p) >= 0) pick = p;
        }
        location.replace((pick || "cs") + "/" + location.search + location.hash);
      })();
    </script>

    <!-- Resolve the theme BEFORE first paint; `preload` stops the first paint from animating.
         ?theme=light|dark|auto and ?template=<family> deep-link a state. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js", "preload");
        var q = new URLSearchParams(location.search);
        var ls = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
        d.setAttribute("data-theme", q.get("theme") || ls("pers-ui-theme") || "light");
        var tpl = q.get("template");
        if (tpl && /^(jdsign|aurora|bento|brutalist|devdark|scholarly)$/.test(tpl)) d.setAttribute("data-template", tpl);
      })();
    </script>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="core/base.css" />
    <link rel="stylesheet" href="kits/site.css" />
    <!-- The design family, jdsign (its accent matches the channel's brand blue): one template stylesheet, which imports its skin. -->
    <link id="template-css" rel="stylesheet" href="templates/site/jdsign.css" />
    <script>
      (function () {
        var t = document.documentElement.getAttribute("data-template");
        if (t) document.getElementById("template-css").href = "templates/site/" + t + ".css";
      })();
    </script>
    <link rel="stylesheet" href="assets/site.css" />
  </head>

    </svg>

        <li><a href="en/" hreflang="en" lang="en"><svg class="chooser-flag" viewBox="0 0 60 30" aria-hidden="true"><use href="#i-flag-gb"/></svg><span class="chooser-code">EN</span> <span>English</span></a></li>
